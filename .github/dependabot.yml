# Weekly library updates. Each one is built and tested by "Check updates", and merged only if it passes.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      everything-else:
        patterns: ["*"]
        exclude-patterns: ["androidx.*"]
    ignore:
      # OkHttp 5 is a rewrite of the networking YouTube playback depends on; move to it deliberately.
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
