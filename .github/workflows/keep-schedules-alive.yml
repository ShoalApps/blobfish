name: Keep schedules alive

# GitHub switches off a public repo's scheduled workflows after 60 days without activity.
# Enabling them through its API twice a month stops that, with no commits or tokens to manage.
# Anything switched off by hand stays off. shoal-common's check-schedules.yml watches this job.
on:
  schedule:
    - cron: "21 5 1,15 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enable this repo's workflows
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq '.workflows[] | select(.path | startswith(".github/workflows/")) | select(.state == "active" or .state == "disabled_inactivity") | "\(.id) \(.state) \(.path)"' |
          while read -r id state path; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/enable"
            echo "$state -> enabled: $path"
          done
