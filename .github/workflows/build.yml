name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Unpack the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SHOAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SHOAL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and run unit tests
        env:
          SHOAL_KEYSTORE_PASSWORD: ${{ secrets.SHOAL_KEYSTORE_PASSWORD }}
          SHOAL_KEY_ALIAS: ${{ secrets.SHOAL_KEY_ALIAS }}
        run: ./gradlew assembleRelease testDebugUnitTest --stacktrace

      - name: Publish release
        run: cp app/build/outputs/apk/release/app-release.apk Blobfish.apk
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Blobfish build ${{ github.run_number }}
          body: Install Blobfish.apk below. Blobfish is free software under the GPL-3.0 and is not affiliated with Bluesky Social PBC.
          files: Blobfish.apk
          make_latest: true
