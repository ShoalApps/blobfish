name: Follow Bluesky schemas
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: compatibility-main
  cancel-in-progress: false
jobs:
  follow:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Fetch verified upstream snapshot
        run: |
          cp -R compat/bluesky/lexicons "$RUNNER_TEMP/previous-lexicons"
          python3 tools/follow-compat.py bluesky
      - name: Check compatibility and generate bundled data
        id: check
        continue-on-error: true
        run: python3 tools/check-bluesky-compat.py --baseline "$RUNNER_TEMP/previous-lexicons" --report compat/bluesky/REPORT.md --asset app/src/main/assets/bluesky-compat.json
      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- compat/bluesky app/src/main/assets/bluesky-compat.json)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Maintain the single feature issue
        if: steps.changes.outputs.changed == 'true'
        run: python3 tools/follow-compat.py bluesky-issue
      - name: Refuse incompatible removals or malformed inputs
        if: steps.check.outcome != 'success'
        run: |
          echo 'Compatibility check failed. No build or push is permitted.' >&2
          exit 1
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.changed == 'true'
      # Same build/test command as build.yml. Signing stays exclusively in build.yml.
      - name: Build release APK and run unit tests before accepting snapshot
        if: steps.changes.outputs.changed == 'true'
        run: ./gradlew assembleRelease testDebugUnitTest --stacktrace
      - name: Commit verified snapshot and dispatch release build
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compat/bluesky app/src/main/assets/bluesky-compat.json
          git commit -m 'Follow Bluesky lexicons after build and tests'
          git push origin HEAD:main
          gh workflow run build.yml --ref main
